name: Manual Coverity Static Analysis Scan with Agent Skills

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  raise-issue-for-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Build unique issue title and body
        id: build_issue
        run: |
          set -euo pipefail

          ts_utc="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          title="Coverity Static Analysis Scan with Agent Skills - ${ts_utc}"
          body_file="$(mktemp)"

          {
            echo "@copilot"
            echo
            echo "Static analysis task for this repository."
            echo
            echo "Run context:"
            echo "- Trigger time (UTC): ${ts_utc}"
            echo "- Workflow run: ${run_url}"
            echo
            echo "Mandatory execution order:"
            echo "1. Use the skill at .github/skills/coverity-scan/SKILL.md first."
            echo "2. Use the skill at .github/skills/coverity-fix/SKILL.md only after step 1 is complete."
            echo
            echo "Required state validation before running the coverity-fix skill:"
            echo "1. Check your action history to verify the coverity-scan skill completed in this issue context."
            echo "2. Verify that a new branch was created or user branch specified for this run."
            echo "3. Verify that the analysis CSV exists in that branch under .github/agent_output/reports."
            echo "4. If the branch is missing, run the coverity-scan skill first and complete all of its required outputs."
            echo "5. If the CSV report is missing, but the branch exists, check the coverity-scan skill execution for errors and re-run it until the CSV is generated and committed to the same branch."
            echo
            echo "Deliverables:"
            echo "1. Use the user-specified branch or create a new branch for this run (unique name with UTC date-time)."
            echo "2. Generate or update the CSV analysis report in that branch as required by the coverity-scan skill."
            echo "3. Open or update a pull request for that branch with the CSV/report changes."
            echo "4. After scan prerequisites are satisfied, run the coverity-fix skill and implement code fixes based on CSV recommendations."
            echo "5. Commit all remediation changes to the same branch."
            echo "6. Update the same pull request with remediation commits and a concise summary of what was fixed."
            echo
            echo "Constraints:"
            echo "- Use only repository-defined skills and instructions."
            echo "- Follow the constraints outlined in those skills."
            echo "- Do not use any subagents for this task."
            echo "- Do not skip required verification or output steps in either skill."
          } > "$body_file"

          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "body_file=$body_file" >> "$GITHUB_OUTPUT"

      - name: Create issue with labels
        id: create_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh label create "copilot" \
            --repo "$REPO" \
            --color "1f6feb" \
            --description "Issues intended for GitHub Copilot" \
            --force

          gh label create "static-analysis" \
            --repo "$REPO" \
            --color "5319e7" \
            --description "Static analysis automation and findings" \
            --force

          issue_url="$(gh issue create \
            --repo "$REPO" \
            --title "${{ steps.build_issue.outputs.title }}" \
            --body-file "${{ steps.build_issue.outputs.body_file }}" \
            --label "copilot" \
            --label "static-analysis")"

          echo "Created issue: $issue_url"
          echo "issue_url=$issue_url" >> "$GITHUB_OUTPUT"

      - name: Assign issue to generic Copilot agent
        env:
          GH_TOKEN: ${{ secrets.ASSIGN_COPILOT_ISSUE_PAT }}
          REPO: ${{ github.repository }}
          ISSUE_URL: ${{ steps.create_issue.outputs.issue_url }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Missing ASSIGN_COPILOT_ISSUE_PAT. Agent assignment requires a user token (PAT/OAuth), not GITHUB_TOKEN."
            exit 1
          fi

          issue_number="${ISSUE_URL##*/}"

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPO/issues/$issue_number/assignees" \
            --input - <<< '{"assignees":["copilot-swe-agent[bot]"]}'

          echo "Assigned issue #$issue_number to copilot-swe-agent[bot]."

