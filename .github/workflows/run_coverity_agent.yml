on:
  schedule:
    # Weekly at 00:00 (midnight) UTC every Monday
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  create_weekly_agent_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create weekly Coverity agent-session issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          DATE="$(date -u +%Y-%m-%d)"
          TITLE="Weekly Coverity Agent Session - ${DATE}"

          AGENT_MD=".github/agents/coverity-analysis.agent.md"
          if [ ! -f "$AGENT_MD" ]; then
            echo "Agent file not found: $AGENT_MD"
            exit 1
          fi

          BODY_FILE="$(mktemp)"
          {
            echo "Auto-created by GitHub Actions on a weekly schedule (00:00 UTC Mondays)."
            echo
            echo "## Agent definition"
            echo
            echo "Source: \`$AGENT_MD\`"
            echo
            echo "----"
            cat "$AGENT_MD"
            echo "----"
            echo
            echo "## Weekly run request"
            echo
            echo "@copilot Please start an agent session for this repo using the agent definition above and run the weekly Coverity analysis tasks."
          } > "$BODY_FILE"

          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$TITLE" \
            --body-file "$BODY_FILE"
