name: coverity-scan-weekly

on:
  # schedule:
  #   - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  raise-issue-for-weekly-scan:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Write body and title for issue
        id: create_issue_body_and_title
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import base64
          import os
          import subprocess
          import tempfile
          import yaml
          
          title = "Perform Weekly Coverity Scan with Copilot Agent"
          lines = [
                "@copilot",
                "",
                "/agent coverity-scan",
                "",
                f"Please perform a static analysis code scan according to the following instructions.",
                "",
                subject_details,
                "",
            ]
            body = "\n".join(lines)
  
            max_issue_body_chars = 60000
            body_len = len(body)
            if body_len > max_issue_body_chars:
                raise RuntimeError(
                    f"Generated issue body is too large ({body_len} chars). "
                    f"Limit is {max_issue_body_chars}. Reduce embedded prompt content."
                )
  
            with tempfile.NamedTemporaryFile(mode="w", delete=False, suffix=".txt") as f:
                f.write(body)
                body_file = f.name
  
            out_path = os.environ["GITHUB_OUTPUT"]
            with open(out_path, "a") as out:
                out.write(f"title={title}\n")
                out.write(f"body_file={body_file}\n")
            PYEOF

      - name: Open Copilot issue to run custom agent
        id: open_issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          issue_url="$(gh issue create \
            --repo "$REPO" \
            --title "${{ steps.create_issue_body_and_title.outputs.title }}" \
            --body-file "${{ steps.create_issue_body_and_title.outputs.body_file }}")"

          echo "Created issue: $issue_url"
          echo "issue_url=$issue_url" >> "$GITHUB_OUTPUT"

      - name: Assign issue to Copilot agent
        id: assign_issue
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT }}
          REPO: ${{ github.repository }}
          ISSUE_URL: ${{ steps.open_issue.outputs.issue_url }}
        run: |
           set -euo pipefail
  
            if [[ -z "${GH_TOKEN:-}" ]]; then
              echo "COPILOT_PAT is empty. Add repo secret COPILOT_PAT with a PAT from a user who can assign Copilot agents."
              exit 1
            fi
            
            issue_number="${ISSUE_URL##*/}"
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$REPO/issues/$issue_number/assignees" \
              --input - <<< "{
                \"assignees\": [\"copilot-swe-agent[bot]\"],
                \"agent_assignment\": {
                  \"custom_agent\": \"l2-test-guardian\"
                }
              }"
  
            echo "Assigned issue #$issue_number to Copilot with custom agent coverity-scan"
  
